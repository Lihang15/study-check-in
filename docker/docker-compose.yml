version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: pg-dev
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
